# The laptop this builds on froze on 2026-10-21 under memory pressure: cap the Gradle JVM, run no daemon,
# and compile Kotlin inside it instead of a second daemon JVM.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
