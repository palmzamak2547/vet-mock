# Smoke e2e — Palm 2026-05-24
# ============================================================
# Catches TDZ-class blank-page regressions BEFORE they hit prod.
# Runs on every push to main + every PR touching src/ or scripts.
#
# Strategy: build the actual prod bundle (`npm run build`), serve
# it via `npm run preview` (vite preview is what `playwright.config.js`
# `webServer` boots), point Playwright at it. This way we test the
# REAL minified bundle that ships, not the dev-mode unminified one
# (TDZ bugs only surface after minification — see hotfix f01f9a4).
#
# 4 projects: Chromium desktop/mobile, WebKit mobile, and Firefox desktop.
# Linux Firefox uses a virtual display and Mesa software graphics. A pixel
# probe fails early if that backend is unavailable, before Atlas assertions.
#
# 2026-09-23 (STAB-14): three runners at once instead of one runner doing
# the two browser steps back to back. The one job took 18-23 min (median
# 22.4): about 2 min of setup, 4.7 min of Chromium, then 11.3 min of
# WebKit + Firefox on one worker. Now Chromium runs on its own runner and
# the software-GL engines run on runners of their own, each still one worker
# with the whole machine to itself, which is the property that made them
# stable.
#
# 2026-10-13: "--shard=1/2" over --project=webkit-mobile --project=firefox-desktop
# never split the pair. Shards cut the ordered test list, which is every WebKit
# test and then every Firefox one, so half 1 ran all 311 WebKit tests and half 2
# all 311 Firefox ones. Green runs of half 1 took 9.7-15.1 min against its
# 16-minute cap (two of the last seven at 15.1), so one failed attempt and its
# retry ran it out of time: on 5.146.0 a 120 s and a 30 s failure, each passing
# on retry, turned the required check red. Each engine is now cut on its own.
#
# 2026-10-14: every shard about 40% of its cap or less, so a slow runner and a
# retried test still fit. Measured on 262880db: chromium (both projects, one
# runner) 10.6 of 14 min, and 12.2-12.3 in three of the five runs before it;
# WebKit half 1 9.1 of 16 (its Atlas WebGL specs come first and are slow on
# Mesa). Chromium now runs one project per runner, WebKit in thirds, Firefox
# (6.7 and 5.9) stays in halves. Add a shard when one passes about 40%.
#
# 2026-11-11: chromium is in halves too. Measured on run 43002929162 (whole job
# minutes, Playwright suite step in brackets): chromium desktop 12.8 (9.2; the
# connected bundle and specs take the rest), chromium mobile 9.9 (8.4), webkit
# thirds 10.6 (8.3), 10.6 (8.2) and 7.5 (5.9), firefox halves 8.2 (6.9) and
# 10.8 (9.3). Playwright's own globalTimeout in CI is 13 minutes
# (playwright.config.js), so chromium desktop was a minute from turning every
# pull request red with more specs landing. The rule: split a job when its tests
# pass 9 of the 13 minutes. Each new runner repeats checkout, npm ci, the browser
# install and the build, about 4 minutes, so this adds 2 runners and about 8
# job-minutes a run (about 76 to about 84) while the slowest job drops from 12.8
# to about 11 (firefox half 2, then chromium desktop half 1 with the connected
# specs at about 9). tests/unit/smoke-matrix.test.mjs fails if a runner is added
# or removed without this list, or if `smoke` stops waiting for the e2e matrix.
# Runners: chromium desktop, half 1; chromium desktop, half 2; chromium mobile,
# half 1; chromium mobile, half 2; webkit, quarter 1; webkit, quarter 2; webkit,
# quarter 3; webkit, quarter 4; firefox, third 1; firefox, third 2; firefox,
# third 3.
#
# 2026-11-11, later: WebKit in quarters and Firefox in thirds. Measured on run
# 43028284316, the first with chromium in halves (job minutes, then the
# Playwright suite step's minutes in brackets): webkit thirds 12.4 (10.2), 10.0
# (7.9) and 9.2 (7.4); firefox halves 9.9 (8.3) and 9.2 (7.7); chromium desktop
# half 1 9.9 (5.9, plus 1.8 for the connected specs), the other chromium halves
# 5.0-5.3 (3.8-4.0). By the rule above webkit third 1 and firefox half 1 were
# past 9 of the 13 minutes' worth of tests or close to it, with about eight more
# specs landing this week. Two more runners (11 in all) at about 4 minutes of
# setup each: about 8 more job-minutes a run. WebKit's 25.5 suite minutes over
# four is about 6.4 a quarter and Firefox's 16.0 over three about 5.3 a third
# (shards cut the test list, not the minutes, so one can run longer), and the
# slowest job should be about 9.9 (chromium desktop half 1).
# The job named `smoke` below is what Vercel and branch protection wait for;
# it passes only when every runner passed.
#
# 2026-11-09 (CI economy, Palm through the main session): a draft pull request
# runs none of the heavy work here. In the week to 9 Nov this workflow ran 131
# times, 7 runners of about 9 minutes each, many of them on pushes to pull
# requests still in progress. A draft gets Build only (build.yml, the cheap
# signal). Marking it ready for review (`ready_for_review`) runs this workflow
# once, and every push after that runs it as before. The PostgreSQL boundary
# job moved here from build.yml on the same day, so marking a pull request
# ready reruns only what its draft skipped, never the build.
#
# On a draft the job that reports `smoke` runs under another name, so the
# commit has no result named `smoke` at all. A skipped job passes a required
# check: if a draft's `smoke` had been skipped (or passed) under its own name,
# `gh pr ready` followed at once by `gh pr merge --auto` could merge on that
# stale result before the run that marking it ready starts had created its
# own. With no result the ruleset waits for that run. `Annotation PostgreSQL`
# keeps its name and is skipped on a draft, which is safe only because of
# this: `smoke` cannot pass before the ready run's e2e has, and by then the
# same run has replaced the draft's skipped `Annotation PostgreSQL`.

name: Smoke e2e

# Every production input must produce the check required by Vercel, including
# API, build-script and configuration-only changes. A path-filtered check can
# otherwise leave a deployment waiting for a check that will never run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # GitHub's three default types, plus the moment a draft is marked ready:
    # the one full run that its draft pushes skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer push replaces a pull request's run, as in build.yml: 16 of 91 runs between 27 Oct and
# 1 Nov were superseded mid-flight and spent 501 runner-minutes after the newer push, holding
# runners other lanes waited for. Each main commit keeps a group of its own and is never cancelled,
# because Vercel promotes that commit only after `smoke` passes on it (build.yml has the history).
concurrency:
  group: smoke-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # A pull request that changes only docs/ and markdown at the repository root cannot change what a browser sees,
    # so it skips the e2e runners (7 of them, 7-10 min each on the docs-only #67 and #71) and `smoke` still reports.
    # Same shape as vca.yml: HEAD^1 is main on a pull request's merge commit. A push to main and a dispatch always run
    # everything, because Vercel holds the production deployment until `smoke` passes on that commit.
    # A draft skips this job, and with it every job that needs it (see the top of this file).
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.diff.outputs.app }}
      tree: ${{ steps.reuse.outputs.tree }}
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then app=true
          elif git diff --quiet HEAD^1 HEAD -- . ':(exclude)docs' ':(exclude,glob)*.md'; then app=false
          else app=true; fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"
      # Reuse, in shadow (Palm's call through the main session, 2 Nov): a green pull request run
      # records the tree it tested (`smoke` below), and a push to main whose tree one already
      # tested could skip e2e. Nothing is skipped: the full gate runs and decides, `smoke` logs the
      # prediction beside the result, and scripts/ci-reuse-shadow-report.mjs gives the agreement
      # rate. Switch it on only if it never disagreed. It has: the 9 Nov report (44 main pushes
      # since 2 Nov) found 2 of 24 would-skip runs red on main, each on a chromium-mobile spec that
      # failed both attempts on a tree its pull request had passed (323cc32d read-aloud.spec.js:152,
      # 9a63e550 library-doc-open.spec.js:97). So the shadow stays on and nothing is skipped.
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          reuse=not-a-push
          if [ "${{ github.event_name }}" = push ]; then
            # Only an unexpired record from a run on this repository counts: a fork's pull request
            # could upload the same name. On an HTTP error gh prints the error JSON, so anything
            # but a small count reads as lookup-failed, never as a hit.
            hits=$(timeout 30 gh api "repos/${{ github.repository }}/actions/artifacts?name=e2e-tested-tree-$tree&per_page=5" \
              --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length' 2>/dev/null) || hits=failed
            case "$hits" in 0) reuse=would-run ;; [1-5]) reuse=would-skip ;; *) reuse=lookup-failed ;; esac
          fi
          echo "tree=$tree" | tee -a "$GITHUB_OUTPUT"
          echo "reuse=$reuse" | tee -a "$GITHUB_OUTPUT"

  # The PostgreSQL boundary tests, a required check by this name. In build.yml until 9 Nov 2026,
  # here since, so that marking a draft ready runs them without running the build again (Build
  # already ran on that commit; marking ready changes no commit). A pull request that changes only
  # docs/ and root markdown cannot move them (5-6 min on #67 and #71) and skips them, which passes
  # the required check, as before. A draft skips them as well, through `changes`; why that is safe
  # is at the top of this file. A push to main and a dispatch run them every time.
  annotation-db:
    name: Annotation PostgreSQL
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: annotation-test-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify atomic annotation writes and account boundaries
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/test-annotation-db.mjs --backend=postgres
      - name: Verify replay-safe study operations and account boundaries
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/test-user-data-db.mjs --backend=postgres
      - name: Verify the Chula sign-in wall (hook, trigger, pre-request, row security, switch)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/test-chula-wall-db.mjs --backend=postgres

  e2e:
    name: e2e (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    strategy:
      # One engine failing must not cancel the others: the report of every
      # engine is what makes a red run readable.
      fail-fast: false
      matrix:
        include:
          - label: chromium desktop, half 1
            group: chromium
            browsers: chromium
            project: chromium-desktop
            shard: 1/2
            connected: true
            report: chromium-desktop-1
          - label: chromium desktop, half 2
            group: chromium
            browsers: chromium
            project: chromium-desktop
            shard: 2/2
            report: chromium-desktop-2
          - label: chromium mobile, half 1
            group: chromium
            browsers: chromium
            project: chromium-mobile
            shard: 1/2
            report: chromium-mobile-1
          - label: chromium mobile, half 2
            group: chromium
            browsers: chromium
            project: chromium-mobile
            shard: 2/2
            report: chromium-mobile-2
          - label: webkit, quarter 1
            group: gl
            browsers: webkit
            project: webkit-mobile
            shard: 1/4
            report: webkit-1
          - label: webkit, quarter 2
            group: gl
            browsers: webkit
            project: webkit-mobile
            shard: 2/4
            report: webkit-2
          - label: webkit, quarter 3
            group: gl
            browsers: webkit
            project: webkit-mobile
            shard: 3/4
            report: webkit-3
          - label: webkit, quarter 4
            group: gl
            browsers: webkit
            project: webkit-mobile
            shard: 4/4
            report: webkit-4
          - label: firefox, third 1
            group: gl
            browsers: firefox
            project: firefox-desktop
            shard: 1/3
            report: firefox-1
          - label: firefox, third 2
            group: gl
            browsers: firefox
            project: firefox-desktop
            shard: 2/3
            report: firefox-2
          - label: firefox, third 3
            group: gl
            browsers: firefox
            project: firefox-desktop
            shard: 3/3
            report: firefox-3
    # Setup (~2 min) + the longest browser step cap (16) + 3 min + 1 spare, so a step
    # that hits its own cap still leaves time to upload the report. The chromium
    # runner also builds the connected bundle (~2 min) and runs its four specs
    # (cap 6) after a 14-minute step, which is 2 + 2 + 14 + 6 + 3 + 1.
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        # `npm ci` strict-checks lockfile so the smoke matches what
        # production ships. --no-audit speeds up CI ~10s.
        run: npm ci --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browsers }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browsers }}-

      - name: Install Playwright browsers
        # Only the engine this runner uses: chromium (desktop + mobile),
        # webkit (real iOS Safari) or firefox (Gecko).
        # On 22 Oct the runners' first apt mirror (azure.archive.ubuntu.com) sent WebKit's system
        # libraries at 75 kB/s: 117 MB took 25 min 51 s, every WebKit job ran into its 28-minute
        # cap before or just after its first test, and apt only fell back to archive.ubuntu.com at
        # the end. apt now starts from the Ubuntu archive, kept only when the list has another mirror.
        run: |
          if grep -v 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt | grep -q .; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps ${{ matrix.browsers }}

      - name: Prepare software graphics
        run: sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils

      - name: Verify Firefox WebGL2
        if: matrix.browsers == 'firefox'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run --auto-servernum node scripts/check-ci-graphics.mjs

      - name: Build production bundle
        # Build the EXACT bundle that ships so we catch minification-
        # specific bugs (TDZ, dead-code removal regressions).
        run: npm run build

      - name: Build the connected bundle (connected runner only)
        # The same sources with placeholder database settings, into a folder of
        # its own so the bundle above stays unconfigured. Four specs model a
        # signed-in account against the back office and skip themselves when
        # the bundle has no database configuration (admin-recovery,
        # external-doc-recovery, pdf-recent-delete, private-notes-reader), so
        # against the plain bundle they never ran. The host is the one those
        # specs intercept (their auth-token key is derived from it) and the
        # key is not a key. Setting these on the plain build instead would
        # configure every spec, including the ones that assume no backend.
        if: matrix.connected
        env:
          VITE_SUPABASE_URL: https://mpovsdzdggvksmeehqfj.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
        run: npx vite build --outDir dist-connected

      # Two engine groups, never one runner for both, because the contention
      # was the bug. Chromium is hardware-independent here and parallelises
      # fine. Firefox and WebKit both run headful against Mesa software GL, and
      # when a second worker competes for that context they slow down 3-5x: on
      # 2026-09-19 a commit whose ONLY change was one line of .mailmap failed
      # summary-pdf-export on firefox at the 60s test timeout, while the
      # byte-identical bundle had passed the same suite 20 minutes earlier and
      # the same two tests finish in 11.4s on a developer machine. Raising the
      # timeout again would have been treating the symptom; giving the
      # software-GL engines the machine to themselves removes it. Each part
      # below still runs one worker on a runner of its own.
      - name: Run smoke e2e (chromium)
        if: matrix.group == 'chromium'
        timeout-minutes: 14
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          xvfb-run --auto-servernum npx playwright test
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}

      - name: Keep the placeholder database host off the real network
        # The connected specs answer every request to that host themselves and
        # abort any other *.supabase.co host. This is the second lock: if a
        # request ever escaped their routes it would reach this machine's own
        # closed port, never the real project. The step fails if the host
        # still answers.
        if: matrix.connected
        run: |
          printf '127.0.0.1 mpovsdzdggvksmeehqfj.supabase.co\n::1 mpovsdzdggvksmeehqfj.supabase.co\n' | sudo tee -a /etc/hosts
          getent ahosts mpovsdzdggvksmeehqfj.supabase.co
          if curl -s --max-time 5 -o /dev/null https://mpovsdzdggvksmeehqfj.supabase.co/; then
            echo "::error::the placeholder database host still answers; refusing to run specs that could reach it"
            exit 1
          fi

      - name: Run the connected specs (chromium)
        if: matrix.connected
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:24732
          PLAYWRIGHT_JSON_OUTPUT_NAME: connected-e2e.json
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_REPORT: playwright-report/connected
        run: |
          set -eu
          ./node_modules/.bin/vite preview --outDir dist-connected --host 127.0.0.1 --port 24732 --strictPort &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:24732/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:24732/ >/dev/null
          xvfb-run --auto-servernum npx playwright test \
            --project=chromium-desktop --project=chromium-mobile \
            --reporter=github,json,html \
            tests/e2e/admin-recovery.spec.js \
            tests/e2e/chula-wall.spec.js \
            tests/e2e/external-doc-recovery.spec.js \
            tests/e2e/pdf-recent-delete.spec.js \
            tests/e2e/private-notes-reader.spec.js \
            tests/e2e/student-profile.spec.js

      - name: The connected specs ran, none skipped
        # A skip is how these specs went unnoticed before: green, 0 run. This
        # fails if the connected bundle ever stops carrying the database
        # settings, or the specs stop finding their screen.
        if: matrix.connected
        run: |
          node -e "const s=JSON.parse(require('fs').readFileSync('connected-e2e.json','utf8')).stats;console.log(JSON.stringify(s));if(!s.expected||s.skipped){console.error('connected specs: need at least one passing test and none skipped');process.exit(1)}"

      - name: Run smoke e2e (software-GL engines, one worker)
        if: matrix.group == 'gl'
        # A part of one engine. A whole engine took up to 15.1 min (WebKit,
        # 311 tests, 13 Oct); the cap stays 16, now with room for a retry.
        timeout-minutes: 16
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          xvfb-run --auto-servernum npx playwright test
          --project=${{ matrix.project }} --workers=1
          --shard=${{ matrix.shard }}

      # Per-test durations against their timeouts. Warns (annotation + step summary) on a test that
      # used more than 40% of its timeout, the same headroom rule the shard caps above follow, so a
      # slow test shows up before a slow runner turns it red.
      - name: e2e duration budget
        if: always()
        run: node scripts/e2e-durations.mjs e2e-results.json connected-e2e.json

      - name: Upload the duration report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-durations-${{ matrix.report }}
          path: |
            e2e-results.json
            connected-e2e.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload HTML report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.report }}
          path: playwright-report/
          retention-days: 7

  # The required check. Its name has been `smoke` since this workflow began,
  # and Vercel's deployment checks and branch protection wait for that name,
  # so it stays. `always()` makes it report even when an e2e runner failed or
  # was cancelled: a skipped job would count as passing a required check.
  # On a draft it runs under another name and only says so, so a draft's commit
  # never carries a `smoke` result (top of this file). It runs rather than
  # skips there so that the name is evaluated and the check reads plainly.
  smoke:
    name: ${{ github.event.pull_request.draft && 'smoke (draft, e2e runs once marked ready)' || 'smoke' }}
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: A draft runs no e2e
        if: github.event.pull_request.draft
        run: echo "::notice title=draft::No e2e on a draft. Marking the pull request ready for review runs them once; the required smoke check waits for that run."
      - name: Every e2e runner passed, or the change was docs only
        if: ${{ !github.event.pull_request.draft }}
        env:
          CHANGES: ${{ needs.changes.result }}
          APP: ${{ needs.changes.outputs.app }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES, app: $APP, e2e runners: $RESULT"
          test "$CHANGES" = "success"
          if [ "$APP" = "false" ]; then exit 0; fi
          test "$RESULT" = "success"
      # Reuse shadow (see `changes`): only a run where every e2e runner passed records its tree.
      - name: Record the tree this green run tested
        if: success() && github.event_name == 'pull_request' && needs.e2e.result == 'success'
        continue-on-error: true
        run: mkdir -p tested && echo "run ${{ github.run_id }}, pull request ${{ github.event.pull_request.number }}, head ${{ github.event.pull_request.head.sha }}" > tested/tree.txt
      - if: success() && github.event_name == 'pull_request' && needs.e2e.result == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tested-tree-${{ needs.changes.outputs.tree }}
          path: tested/tree.txt
          retention-days: 14
      - name: Reuse shadow verdict
        if: always() && github.event_name == 'push'
        run: echo "::notice title=reuse-shadow::predicted=${{ needs.changes.outputs.reuse }} e2e=${{ needs.e2e.result }} tree=${{ needs.changes.outputs.tree }}"
