# Smoke e2e — Palm 2026-05-24
# ============================================================
# Catches TDZ-class blank-page regressions BEFORE they hit prod.
# Runs on every push to main + every PR touching src/ or scripts.
#
# Strategy: build the actual prod bundle (`npm run build`), serve
# it via `npm run preview` (vite preview is what `playwright.config.js`
# `webServer` boots), point Playwright at it. This way we test the
# REAL minified bundle that ships, not the dev-mode unminified one
# (TDZ bugs only surface after minification — see hotfix f01f9a4).
#
# 4 projects: Chromium desktop/mobile, WebKit mobile, and Firefox desktop.
# Linux Firefox uses a virtual display and Mesa software graphics. A pixel
# probe fails early if that backend is unavailable, before Atlas assertions.

name: Smoke e2e

# Every production input must produce the check required by Vercel, including
# API, build-script and configuration-only changes. A path-filtered check can
# otherwise leave a deployment waiting for a check that will never run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Leave time to retain diagnostics when the browser step itself times out.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        # `npm ci` strict-checks lockfile so the smoke matches what
        # production ships. --no-audit speeds up CI ~10s.
        run: npm ci --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        # All 3 engines — the smoke matrix runs chromium (desktop +
        # mobile), webkit (real iOS Safari), and firefox (Gecko).
        # Cross-engine coverage catches Safari/Firefox-only regressions.
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Prepare software graphics
        run: sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils

      - name: Verify Firefox WebGL2
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run --auto-servernum node scripts/check-ci-graphics.mjs

      - name: Build production bundle
        # Build the EXACT bundle that ships so we catch minification-
        # specific bugs (TDZ, dead-code removal regressions).
        run: npm run build

      # Two steps, not one, because the contention was the bug.
      # Chromium is hardware-independent here and parallelises fine. Firefox
      # and WebKit both run headful against Mesa software GL, and when a second
      # worker competes for that context they slow down 3-5x: on 2026-09-19 a
      # commit whose ONLY change was one line of .mailmap failed
      # summary-pdf-export on firefox at the 60s test timeout, while the
      # byte-identical bundle had passed the same suite 20 minutes earlier and
      # the same two tests finish in 11.4s on a developer machine. Raising the
      # timeout again would have been treating the symptom; giving the
      # software-GL engines the machine to themselves removes it.
      - name: Run smoke e2e (chromium)
        timeout-minutes: 14
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          xvfb-run --auto-servernum npx playwright test
          --project=chromium-desktop --project=chromium-mobile

      - name: Run smoke e2e (software-GL engines, one worker)
        timeout-minutes: 16
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          xvfb-run --auto-servernum npx playwright test
          --project=webkit-mobile --project=firefox-desktop --workers=1

      - name: Upload HTML report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
