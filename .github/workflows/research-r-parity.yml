# ============================================================
# VetMock Research: R parity (M1-DESIGN.md 13.2, M2-DESIGN.md 3)
# ============================================================
# Runs only when something under research/ changes.
#
# Job "engine": the JavaScript engine against the committed R 4.6.0
#   fixtures (research/tests/fixtures/r/out/*.json, made with webR 0.6.0).
#   Closed forms 1e-10 relative, iterative fits 1e-6, uniroot values at
#   R's own uniroot tolerance; M2 adds Dunnett (1e-8 absolute on p, 1e-8
#   relative on the critical value) and the chart density (1e-3 absolute).
#   Any mismatch fails. M1 methods: rparity-engine.test.mjs; M2 methods:
#   rparity-m2.test.mjs (a case whose module still carries the STUB(m2)
#   marker is skipped with its reason; M2 ships only with none left).
#
# Job "native-r": the second check. Native R 4.6.0 reruns every
#   research/tests/fixtures/r/*.R with the package versions recorded in
#   the committed files and compares with them (compare.mjs NATIVE_REL:
#   the same R source, a different C library underneath). A different
#   package version fails the job instead of being compared.
# ============================================================
name: Research R parity

on:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - '.github/workflows/research-r-parity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/**'
      - '.github/workflows/research-r-parity.yml'

concurrency:
  group: research-r-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: research/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Engine against the R 4.6.0 fixtures
        run: node --test tests/unit/rparity-engine.test.mjs tests/unit/rparity-m2.test.mjs tests/unit/rparity-compare.test.mjs

  native-r:
    runs-on: ubuntu-latest
    # M2 adds car, multcomp, FSA, pROC, survey, sandwich, psych, MethComp and boot at pinned versions;
    # an archived version installs from source, so the job gets more time than M1's 30 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install the recorded package versions
        run: |
          export PKGS="$(node research/scripts/r-parity/run-native.mjs --packages)"
          echo "packages: $PKGS"
          Rscript -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'
          # Resolve dependencies first; exact pins conflict with bundled packages in pak's solver.
          # Restore every recorded version from CRAN, then let run-native enforce exact pins.
          Rscript - <<'RSCRIPT'
          refs <- strsplit(Sys.getenv("PKGS"), " ")[[1]]
          pins <- strsplit(refs, "@", fixed = TRUE)
          pak::pkg_install(c("remotes", vapply(pins, `[`, character(1), 1)), upgrade = FALSE, ask = FALSE)
          for (pin in pins) {
            pkg <- pin[[1]]
            version <- pin[[2]]
            if (as.character(packageVersion(pkg)) == version) next
            # CRAN archive names may use hyphens (mvtnorm1.2-4); compare normalized versions.
            remotes::install_version(pkg, version = version, repos = "https://cran.r-project.org",
                                     dependencies = FALSE, upgrade = "never")
            if (as.character(packageVersion(pkg)) != version) stop(sprintf("%s: expected %s", pkg, version))
          }
          RSCRIPT
        shell: bash

      - name: Native R against the committed webR fixtures
        run: node research/scripts/r-parity/run-native.mjs
