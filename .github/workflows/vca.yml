# ============================================================
# VetMock VCA (vca.vetmock.com)
# ============================================================
# Runs when the VCA app changes, or when something it reads from the
# main app changes: the question banks and registry in src/data, the
# three shared modules in src/lib, and the art and fonts in public.
#
# Steps, in the order a contributor runs them locally:
#   npm run bank   rebuilds the per-domain bank from ../src/data and
#                  fails on a bank the generator cannot place
#   npm test       the unit tests (sets, sessions, progress, almanac,
#                  exam calendar, domain mapping, the layers' import
#                  rules, the community's shapes and demo backend)
#   npm run test:db  the community schema (supabase/migrations/
#                  *_vca_community.sql) in a throwaway in-memory
#                  Postgres (PGlite): policies, guards, counts, the
#                  VetMock bridge and account deletion
#   npm run build  the production bundle plus the per-route heads
#                  and sitemap (scripts/prerender.mjs)
# The covers in public/og and the icons in public/icons are drawn
# locally with Playwright (npm run og, npm run icons) and committed,
# so this job needs no browser.
# ============================================================
name: VCA

on:
  push:
    branches: [main]
    paths:
      - 'vca/**'
      - 'src/data/**'
      - 'src/lib/question-metadata.js'
      - 'src/lib/option-shuffle.js'
      - 'src/lib/richtext.jsx'
      - 'public/**'
      - 'supabase/migrations/*vca*'
      - 'supabase/functions/_shared/app-origins.js'
      - '.github/workflows/vca.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vca-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required checks cannot be path-filtered (a check that never runs blocks the
  # pull request forever), so pull requests always start this workflow and this
  # job decides whether the real jobs run. HEAD^1 is main on a pull request's
  # merge commit; push (already path-filtered) and dispatch (the queue
  # workflow) always run everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then relevant=true
          elif git diff --quiet HEAD^1 HEAD -- vca src/data src/lib/question-metadata.js src/lib/option-shuffle.js src/lib/richtext.jsx public 'supabase/migrations/*vca*' supabase/functions/_shared/app-origins.js .github/workflows/vca.yml; then relevant=false
          else relevant=true; fi
          echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"

  build:
    name: VCA bundle
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vca
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: vca/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the bank from the main app's data
        run: npm run bank

      - name: Unit tests
        run: npm test

      - name: Community schema in a throwaway database
        run: npm run test:db

      - name: Build production bundle and route heads
        run: npm run build

      - name: Report bundle sizes
        run: |
          echo "## VCA bundle" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/ dist/assets dist/bank >> $GITHUB_STEP_SUMMARY || true
          ls -lh dist/assets/ | awk 'NR>1 {print $5, $9}' | sort -rh | head -12 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # The required check. Passes when the jobs above passed, or were skipped
  # because this pull request does not touch the VCA app or what it reads.
  vca:
    name: VCA
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "results: $RESULTS"
          test "$CHANGES" = success
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1;; esac; done
