# ============================================================
# CI guard against question-bank quality regressions.
#
# Triggered on every push/PR to main; runs the bias linter in
# warn-only mode and fails the job only if NEW errors appear
# (existing errors documented in the baseline below). Warnings
# show up in the PR conversation but don't block merging.
#
# Baseline ratchet (only goes DOWN, never up):
#   • 2026-05-12  v5.7.0   78 (8 files only · pre-Wave-3)
#   • 2026-05-20 recal    295 (34 files · all questions-*.js banks
#                              discovered after Palm audit)
#
# When you rewrite biased distractors locally + lint count drops,
# update MAX_ERRORS to the new lower number. CI will fail any PR
# that introduces a regression past the current ceiling.
# ============================================================
name: Lint questions

on:
  push:
    branches: [main]
    paths:
      - 'src/data/questions-*.js'
      - 'scripts/lint-questions.cjs'
      - '.github/workflows/lint-questions.yml'
  pull_request:
    paths:
      - 'src/data/questions-*.js'
      - 'scripts/lint-questions.cjs'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run question linter
        id: lint
        run: |
          # warn-only so the script always exits 0; we extract counts
          # ourselves and fail the job if errors exceed the baseline.
          node scripts/lint-questions.cjs --warn-only --json > /tmp/lint.json
          echo "errors=$(node -e 'console.log(JSON.parse(require(\"fs\").readFileSync(\"/tmp/lint.json\",\"utf8\")).errors)')" >> $GITHUB_OUTPUT
          echo "warnings=$(node -e 'console.log(JSON.parse(require(\"fs\").readFileSync(\"/tmp/lint.json\",\"utf8\")).warnings)')" >> $GITHUB_OUTPUT
          node scripts/lint-questions.cjs --warn-only

      - name: Enforce baseline
        env:
          # Baseline recalibrated 2026-05-20 after extending lint scope
          # from 8 hardcoded files → all 34 questions-*.js banks via
          # auto-discovery. Current count = 291 errors; ceiling 295
          # leaves a tiny buffer for incidental drift but blocks any
          # meaningful regression. Lower this whenever fix:questions
          # actually reduces the count.
          MAX_ERRORS: 295
        run: |
          ERRORS=${{ steps.lint.outputs.errors }}
          echo "Errors: $ERRORS / baseline $MAX_ERRORS"
          if [ "$ERRORS" -gt "$MAX_ERRORS" ]; then
            echo "::error::Question lint introduced $((ERRORS - MAX_ERRORS)) new error(s) over the current baseline ($MAX_ERRORS)."
            echo "::error::Run \`npm run fix:questions\` and \`npm run lint:questions\` locally before pushing, or rewrite the offending distractors."
            exit 1
          fi
