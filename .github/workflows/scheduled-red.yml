# ============================================================
# A red automation opens an issue
# ============================================================
# A scheduled run that fails mails only the last person who edited its
# workflow file, and only if their settings allow it; a red Build on main
# tells only whoever merged. On 15 Nov 2026 the Android job had been red for
# two days with nobody told, and the dependency merge step could print
# "could not be merged" inside a green run.
#
# When one of the workflows below completes with a failure (a scheduled run,
# or Build on a main push), this opens one issue titled "red: <workflow>"
# with the failed jobs and their links; while that issue is open, a later red
# run comments on it instead of opening another. Repository watchers are
# notified of both. It reruns nothing (main-rerun-once.yml owns Smoke e2e).
#
# Build on a main push used to be listed here. Since 16 Nov 2026 the build job is part of Smoke e2e,
# so a red build on main is rerun once and then reported by main-rerun-once.yml, like any e2e job.
name: Scheduled red

on:
  workflow_run:
    workflows: ['Production watch', 'Dependency updates', 'Android app']
    types: [completed]

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  report:
    name: report a red automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') &&
      (github.event.workflow_run.event == 'schedule' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="red: ${NAME}"
          jobs="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- [" + .name + "](" + .html_url + ")"')"
          body="${NAME} failed (${EVENT}, ${SHA:0:8}).

          Run: ${RUN_URL}

          Failed jobs:
          ${jobs:-"- (none listed: open the run)"}

          Close this issue once the next run is green."
          number="$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"${title}\")][0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
