# ============================================================
# Build CI — gates broken builds before they hit production
# ============================================================
# Runs on every push/PR to main. Fails fast if:
#   • npm ci breaks (lockfile drift, missing dep)
#   • Vite build errors (broken JS, missing import, syntax error,
#     bad template literal in data files like questions/notes)
#
# Vercel auto-deploys on every push to main, so this workflow is
# the LAST chance to catch regressions before users see the white
# screen of death. Total job ~2-4 min warm; up to ~8 min cold-cache
# (job cap 10m, audit step capped at 2m separately).
#
# `npm audit --production` is a soft check — warns but doesn't fail
# (would create unfixable CI noise from upstream advisories).
# ============================================================
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs when new commits land on the same ref —
# saves Action minutes on rapid-fire pushes.
concurrency:
  # A newer push replaces a pull request's run. On main every merge is a deploy that Vercel holds
  # until build and smoke pass, so each main commit gets a group of its own and is never cancelled
  # or replaced: on 22 Oct #58 merged, #48 merged a minute later, #58's Build was cancelled, its
  # deployment failed its checks and was not promoted, and #48's commit (vca/ only) was skipped by
  # the Ignored Build Step, so #58 never went live. One shared main group without cancel-in-progress
  # was not enough: GitHub keeps one pending run per group and cancels the older pending one
  # (a9e175ac, ef444c33 the same day).
  group: build-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  annotation-db:
    name: Annotation PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: annotation-test-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify atomic annotation writes and account boundaries
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/test-annotation-db.mjs --backend=postgres
      - name: Verify replay-safe study operations and account boundaries
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/test-user-data-db.mjs --backend=postgres

  build:
    runs-on: ubuntu-24.04
    # 2026-09-04: a cold-cache npm ci + build measured past 5m on the
    # standard runner, and the old cap killed the job mid-audit while
    # the Vercel deploy (which has its own pipeline) kept shipping —
    # CI lost its gate-the-deploy purpose. 10m gives the whole job real
    # headroom; the audit step carries its own 2m cap so it cannot be
    # the thing that blows this budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Contract tests
        run: npm run test:unit

      # Before the build, on purpose. The build regenerates the changelog
      # banner and prebuild regenerates the Mochi poses, so lints that ran
      # after it only ever saw freshly written files and could not fail on a
      # stale committed one. None of these steps reads dist/. lint:data starts
      # with lint:untracked and ends with lint:atlas.
      - name: Generated data and content gates
        run: npm run lint:data

      - name: Build production bundle
        run: npm run build

      - name: Install browser for contrast checks
        # Same mirror as smoke-e2e.yml's install step: on 22 Oct azure.archive.ubuntu.com made this
        # step take 12.5 min and main's Build ran out its 15-minute cap, so nothing deployed.
        run: |
          if grep -v 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt | grep -q .; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium

      # The contrast audits measure the built bundle, so only they wait for it.
      - name: Accessibility gates on the built bundle
        run: npm run lint:dist

      - name: Report bundle sizes
        run: |
          echo "## Bundle sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY || true
          ls -lh dist/assets/ | awk 'NR>1 {print $5, $9}' | sort -rh | head -20 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Soft audit — warns but doesn't block (upstream advisories
      # often outpace upstream fixes; we don't want CI red on those).
      # --omit=dev replaces the deprecated --production flag; the
      # registry ping occasionally stalls on runner networks, and a
      # warn-only step must never eat the whole job budget — hence
      # its own short timeout so a hang cancels the step, not the build.
      - name: Security audit (warn-only)
        continue-on-error: true
        timeout-minutes: 2
        run: npm audit --omit=dev --audit-level=high || echo "::warning title=Security audit::npm audit found high-severity advisories (warn-only step, does not block)"
