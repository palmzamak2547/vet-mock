<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <rect width="800" height="1000" fill="#ffffff"/>
  <g fill="none" stroke="#555" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Skull (smaller, rounder than dog) -->
    <path d="M115 365 Q90 365 82 385 Q78 408 105 418 L150 420 Q180 418 192 405 Q200 388 188 374 Q170 360 145 360 Z"/>
    <path d="M100 420 Q120 435 165 432 Q185 430 192 420"/>
    <circle cx="105" cy="385" r="3" fill="#555"/>
    <!-- Cervical (7) -->
    <g>
      <rect x="198" y="375" width="20" height="28" rx="3"/>
      <rect x="220" y="372" width="20" height="30" rx="3"/>
      <rect x="243" y="370" width="20" height="32" rx="3"/>
      <rect x="266" y="370" width="20" height="32" rx="3"/>
      <rect x="289" y="372" width="20" height="32" rx="3"/>
      <rect x="312" y="375" width="20" height="32" rx="3"/>
      <rect x="335" y="378" width="20" height="32" rx="3"/>
    </g>
    <!-- Thoracic (13) -->
    <g>
      <rect x="365" y="382" width="18" height="28" rx="2"/>
      <rect x="386" y="382" width="18" height="28" rx="2"/>
      <rect x="407" y="382" width="18" height="28" rx="2"/>
      <rect x="428" y="382" width="18" height="28" rx="2"/>
      <rect x="449" y="382" width="18" height="28" rx="2"/>
      <rect x="470" y="382" width="18" height="28" rx="2"/>
      <rect x="491" y="382" width="18" height="28" rx="2"/>
      <rect x="512" y="382" width="18" height="28" rx="2"/>
      <rect x="533" y="382" width="18" height="28" rx="2"/>
      <rect x="554" y="382" width="18" height="28" rx="2"/>
      <rect x="575" y="382" width="18" height="28" rx="2"/>
      <rect x="596" y="382" width="18" height="28" rx="2"/>
      <rect x="617" y="382" width="18" height="28" rx="2"/>
    </g>
    <!-- Ribs (more curved, narrower) -->
    <g stroke-width="1.5">
      <path d="M375 410 Q365 490 395 560"/>
      <path d="M398 410 Q390 500 425 570"/>
      <path d="M421 410 Q415 505 455 575"/>
      <path d="M444 410 Q440 510 485 580"/>
      <path d="M467 410 Q467 510 510 580"/>
      <path d="M490 410 Q495 510 535 580"/>
      <path d="M513 410 Q520 505 555 575"/>
      <path d="M536 410 Q545 500 575 570"/>
      <path d="M559 410 Q570 495 590 560"/>
      <path d="M582 410 Q590 485 605 545"/>
      <path d="M605 410 Q612 470 615 525"/>
    </g>
    <!-- Lumbar (7) -->
    <g>
      <rect x="642" y="382" width="18" height="30" rx="2"/>
      <rect x="662" y="382" width="18" height="30" rx="2"/>
      <rect x="682" y="382" width="18" height="30" rx="2"/>
      <rect x="702" y="382" width="18" height="30" rx="2"/>
      <rect x="722" y="382" width="18" height="30" rx="2"/>
    </g>
    <!-- Sacrum -->
    <path d="M744 384 Q758 388 759 410 L755 420 Q745 420 740 414 Z"/>
    <!-- Tail (longer, feline) -->
    <g>
      <circle cx="768" cy="405" r="5"/>
      <circle cx="778" cy="425" r="5"/>
      <circle cx="785" cy="448" r="5"/>
      <circle cx="787" cy="472" r="4"/>
      <circle cx="780" cy="498" r="4"/>
      <circle cx="770" cy="525" r="4"/>
      <circle cx="755" cy="550" r="4"/>
      <circle cx="740" cy="573" r="3"/>
      <circle cx="725" cy="595" r="3"/>
      <circle cx="710" cy="615" r="3"/>
    </g>
    <!-- Scapula (smaller) -->
    <path d="M325 412 L360 470 L375 465 L340 408 Z"/>
    <!-- Humerus -->
    <path d="M370 465 L362 570" stroke-width="3.5"/>
    <circle cx="362" cy="575" r="5"/>
    <!-- Radius/Ulna -->
    <path d="M362 580 L366 700" stroke-width="2.5"/>
    <path d="M370 580 L373 700" stroke-width="1.5"/>
    <!-- Carpals + paw -->
    <g>
      <ellipse cx="368" cy="710" rx="9" ry="5"/>
      <rect x="361" y="720" width="14" height="8"/>
      <rect x="357" y="732" width="20" height="28"/>
    </g>
    <!-- Pelvis -->
    <path d="M675 412 Q688 470 670 525 Q645 535 638 505 Q638 470 650 425 Z"/>
    <!-- Femur -->
    <circle cx="657" cy="538" r="6"/>
    <path d="M657 542 L652 670" stroke-width="3.5"/>
    <circle cx="652" cy="675" r="5"/>
    <!-- Tibia / Fibula -->
    <path d="M652 680 L660 800" stroke-width="2.5"/>
    <path d="M657 680 L670 800" stroke-width="1.5"/>
    <!-- Tarsals -->
    <g>
      <ellipse cx="660" cy="808" rx="9" ry="5"/>
      <rect x="653" y="818" width="14" height="8"/>
      <rect x="650" y="830" width="22" height="30"/>
    </g>
  </g>
  <g fill="#333" font-family="system-ui, -apple-system, 'IBM Plex Sans Thai', sans-serif" font-size="14">
    <text x="60" y="345">Skull</text>
    <text x="220" y="365">Cervical C1–C7</text>
    <text x="420" y="370">Thoracic T1–T13</text>
    <text x="660" y="370">Lumbar L1–L7</text>
    <text x="740" y="370">Sacrum</text>
    <text x="710" y="640">Tail (long, feline)</text>
    <text x="298" y="425">Scapula</text>
    <text x="300" y="540">Humerus</text>
    <text x="298" y="635">Radius / Ulna</text>
    <text x="298" y="755">Carpals</text>
    <text x="690" y="495">Pelvis</text>
    <text x="685" y="610">Femur</text>
    <text x="685" y="735">Tibia / Fibula</text>
    <text x="685" y="850">Tarsals</text>
  </g>
  <g fill="#333" font-family="system-ui, -apple-system, 'IBM Plex Sans Thai', sans-serif">
    <text x="400" y="60" text-anchor="middle" font-size="22" font-weight="600">โครงกระดูกแมว (lateral)</text>
    <text x="400" y="85" text-anchor="middle" font-size="13" fill="#777">Feline skeleton — smaller skull, longer tail vs canine</text>
  </g>
</svg>
