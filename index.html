    <!-- Anti-FOUC: set the theme + base page background synchronously,
         BEFORE the stylesheet/React load, so a dark-mode user never sees a
         flash of light background on first paint (matters most for the
         landing page, which paints its own bg). Reads the same key the app
         persists (vmx-theme), falls back to the OS preference. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('vmx-theme');
          var t = raw ? JSON.parse(raw) : null;
          if (t !== 'light' && t !== 'dark') {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          var d = document.documentElement;
          d.setAttribute('data-theme', t);
          d.style.colorScheme = t;
          d.style.background = t === 'dark' ? '#1a1612' : '#f6efe4';
        } catch (e) {}
      })();
    </script>

    <!-- Search engine verification -->
    <meta name="google-site-verification" content="14yg3AaHe91BC8VgVxjhxTrJsHCgvDSUIKetsJozHX0" />

    <!-- Resource hints — speed up first paint and lazy chunks.
         dns-prefetch + preconnect = warm up TCP/TLS to Supabase domain
         before the SDK actually loads (saves ~100-300ms on cold session
         resume / first sign-in). Conditional based on env: only for the
         project's actual project domain so we don't waste a connection
         when Supabase isn't configured. -->
    <link rel="dns-prefetch" href="https://mpovsdzdggvksmeehqfj.supabase.co" />
    <link rel="preconnect" href="https://mpovsdzdggvksmeehqfj.supabase.co" crossorigin />
    <!-- YouTube embed (videos page) — used in iframe, getting ahead of
         the connection saves ~200ms when user opens a clip. -->
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />

    <!-- Google Fonts — preconnect (warm TLS) + async load. Was previously
         injected from App.jsx useEffect, which ran AFTER first paint and
         caused a brief unstyled flash. Loading here with media=print +
         onload swap means the stylesheet downloads in parallel with HTML
         but doesn't block render. The <noscript> fallback covers the
         (rare) case where JS is disabled. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,700&family=JetBrains+Mono:wght@500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,700&family=JetBrains+Mono:wght@500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,700&family=JetBrains+Mono:wght@500&display=swap"
      />
    </noscript>

    <!-- Icons + PWA.
         Order matters: Safari (esp. older versions on iOS/macOS) walks
         the list and picks the first viable entry, falling back only
         when the chosen one fails to load. Listing .ico FIRST gives
         Safari something it always renders in tabs without quirks,
         and the SVG below kicks in on browsers that prefer scalable.
         apple-touch-icon stays for iOS home-screen install.
         mask-icon is Safari macOS pinned-tab specific (monochrome). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#4a6b4a" />
    <link rel="manifest" href="/manifest.webmanifest" />
